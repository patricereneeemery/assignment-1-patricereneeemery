name: Assignment1 CI

on:
  push:
    branches:
      - Assignment1
    paths:
      - '**.c'
      - '**.h'
      - 'Makefile'
      - '.github/workflows/assignment1.yml'
  pull_request:
    branches:
      - Assignment1

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build
        run: |
          make

      - name: Run tests
        run: |
          make test || echo "No test target defined"
